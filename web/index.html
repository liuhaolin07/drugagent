<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrugAgent · 多智能体药物发现助手</title>
<script src="/marked.min.js"></script>
<style>
:root{--bg:#0c1220;--card:#141d30;--line:#24324d;--txt:#e6edf7;--dim:#8fa3c0;--blue:#4c8dff;--green:#37d39b}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(1200px 600px at 20% -10%,#16233c 0%,var(--bg) 55%);color:var(--txt);min-height:100vh}
header{padding:28px 32px 6px}
header h1{margin:0;font-size:26px;letter-spacing:.5px}
header h1 .v{font-size:12px;color:var(--blue);border:1px solid var(--blue);border-radius:20px;padding:2px 10px;vertical-align:middle;margin-left:8px}
header p{color:var(--dim);margin:8px 0 0}
.controls{display:flex;gap:12px;align-items:center;padding:18px 32px}
.controls input{flex:1;max-width:520px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:#0f1728;color:var(--txt);font-size:15px;outline:none}
.controls input:focus{border-color:var(--blue)}
.controls button{padding:12px 26px;border-radius:10px;border:0;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:15px;cursor:pointer}
.controls button:disabled{opacity:.45;cursor:not-allowed}
#status{color:var(--dim);font-size:13px}
main{padding:8px 32px 40px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-style:normal;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
.pill.run{color:#ffd76a;border-color:#8a6d1f}
.pill.done{color:var(--green);border-color:#1f6d52}
.content{font-size:14px;line-height:1.85;color:#d7e2f2;overflow-wrap:anywhere}
.content h1,.content h2,.content h3{font-size:15px;margin:10px 0 6px}
.content table{border-collapse:collapse;margin:8px 0;font-size:13px}
.content th,.content td{border:1px solid var(--line);padding:4px 10px;white-space:nowrap}
.content th{background:#0f1728}
.content pre{background:#0f1728;padding:10px;border-radius:8px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.grid figure{margin:0;background:#0f1728;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.grid img{width:100%;height:auto}
.grid figcaption{font-size:12px;color:var(--dim);margin-top:4px}
footer{color:var(--dim);font-size:12px;padding:0 32px 28px}
</style>
</head>
<body>
<header>
  <h1>🧬 DrugAgent <span class="v">v0.4</span></h1>
  <p>多智能体药物发现助手 · 文献检索员 → 分子分析员 → 分子优化员 → 综合评审员</p>
</header>
<div class="controls">
  <input id="topic" value="EGFR 抑制剂" placeholder="输入靶点 / 主题，例如：EGFR 抑制剂">
  <button id="go">开始分析</button>
  <span id="status"></span>
</div>
<main>
  <section class="card"><h2>① 文献检索员（本地知识库 + PubMed 在线检索）<i class="pill" id="p-lit">等待</i></h2><div class="content" id="c-lit"></div></section>
  <section class="card"><h2>② 分子分析员（PubChem + RDKit 性质计算）<i class="pill" id="p-mol">等待</i></h2><div class="content" id="c-mol"></div><div class="grid" id="mol-grid"></div></section>
  <section class="card"><h2>③ 分子优化员（规则式类似物生成 + 性质优化筛选）<i class="pill" id="p-opt">等待</i></h2><div class="content" id="c-opt"></div><div class="grid" id="opt-grid"></div></section>
  <section class="card"><h2>④ 综合评审员（候选分子分析报告 + 参考文献）<i class="pill" id="p-rep">等待</i></h2><div class="content" id="c-rep"></div></section>
</main>
<footer>数据源：PubMed / PubChem / RDKit · 模型：GLM-4-Flash（免费档）+ DeepSeek 兜底 · 仅供学习研究演示</footer>
<script>
const $ = id => document.getElementById(id);
const esc = t => (t || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const render = t => (window.marked ? marked.parse(t || '') : '<pre>' + esc(t) + '</pre>');
function setPill(id, cls, txt) { const p = $(id); p.className = 'pill ' + (cls || ''); p.textContent = txt; }
const fmtD = v => (v > 0 ? '+' : '') + v;
let timer = null, t0 = 0;
$('go').onclick = () => {
  const topic = $('topic').value.trim() || 'EGFR 抑制剂';
  $('go').disabled = true;
  ['lit','mol','opt','rep'].forEach(k => { setPill('p-'+k,'','等待'); $('c-'+k).innerHTML = ''; });
  $('mol-grid').innerHTML = ''; $('opt-grid').innerHTML = '';
  t0 = Date.now();
  timer = setInterval(() => { $('status').textContent = '分析中… ' + (Math.round((Date.now()-t0)/100)/10) + 's'; }, 200);
  setPill('p-lit', 'run', '进行中…');
  const ev = new EventSource('/api/run?topic=' + encodeURIComponent(topic));
  ev.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'start') { window._cands = d.candidates || []; }
    else if (d.type === 'stage') {
      const map = {literature:'lit', molecules:'mol', optimization:'opt', report:'rep'}[d.stage];
      setPill('p-'+map, 'done', '完成');
      $('c-'+map).innerHTML = render(d.text) + (d.refs ? render(d.refs) : '');
      if (d.stage === 'literature') setPill('p-mol', 'run', '进行中…');
      if (d.stage === 'molecules') {
        setPill('p-opt', 'run', '进行中…');
        $('mol-grid').innerHTML = (window._cands || []).map(n =>
          `<figure><img src="/api/molimg?name=${encodeURIComponent(n)}" alt="${n}"><figcaption>${n}</figcaption></figure>`).join('');
      }
      if (d.stage === 'optimization') {
        setPill('p-rep', 'run', '进行中…');
        $('opt-grid').innerHTML = (d.analogs || []).map(a =>
          `<figure><img src="/api/molimg?smiles=${encodeURIComponent(a.smiles)}" alt="${a.id}">` +
          `<figcaption>${a.id} · ${esc(a.label)}<br>QED ${a.qed}（Δ${fmtD(a.dqed)}）· 相似度 ${a.sim}</figcaption></figure>`).join('');
      }
    }
    else if (d.type === 'done') { clearInterval(timer); $('go').disabled = false; $('status').textContent = '完成 ✅ 用时 ' + d.elapsed + 's' + (d.report_path ? ' · 报告已存 ' + d.report_path : ''); ev.close(); }
    else if (d.type === 'error') { clearInterval(timer); $('go').disabled = false; $('status').textContent = '出错：' + d.message; ev.close(); }
  };
  ev.onerror = () => { clearInterval(timer); $('go').disabled = false; $('status').textContent = '连接中断（请查看控制台日志）'; ev.close(); };
};
</script>
</body>
</html>
